version: '3.8'

services:
  # MySQL Primary Node
  mysql-primary:
    image: mysql:8.4
    container_name: procom-mysql-primary
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # ports only exposed internally via Docker network
    # - "3306:3306"
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  # MySQL Router for automatic failover
  mysql-router:
    build:
      context: ./mysql/router
      dockerfile: Dockerfile
    container_name: procom-mysql-router
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql-primary
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # ports:
    #   - "6446:6446"
    #   - "6447:6447"
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - backend-net

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procom-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_PORT_RO: ${DB_PORT_RO}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_DEBUG: ${APP_DEBUG}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      UPLOAD_DIR: ${UPLOAD_DIR}
      TESSERACT_LANG: ${TESSERACT_LANG}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      VSPHERE_URL: ${VSPHERE_URL}
      VSPHERE_USER: ${VSPHERE_USER}
      VSPHERE_PASS: ${VSPHERE_PASS}
      VSPHERE_SSL_VERIFY: ${VSPHERE_SSL_VERIFY}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT}
      LOG_LEVEL: ${LOG_LEVEL}
    # backend only accessed internally by frontend
    # ports:
    #   - "8080:8080"
    volumes:
      - uploads:/var/www/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  # Email Worker (background daemon)
  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procom-email-worker
    restart: unless-stopped
    command: php /var/www/html/bin/email-worker.php
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      UPLOAD_DIR: ${UPLOAD_DIR}
      TESSERACT_LANG: ${TESSERACT_LANG}
      GRAPH_API_URL: ${GRAPH_API_URL}
      GRAPH_API_TOKEN: ${GRAPH_API_TOKEN}
      EMAIL_POLL_INTERVAL: ${EMAIL_POLL_INTERVAL}
      EMAIL_MAILBOX: ${EMAIL_MAILBOX}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - uploads:/var/www/uploads
    depends_on:
      - backend
      - mysql-primary
    networks:
      - backend-net

  # Frontend (React SPA served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procom-frontend
    restart: unless-stopped
    ports:
      - "80:9001"
    depends_on:
      - backend
    networks:
      - frontend-net

  # Compliance Worker (cron - checks vendor expiry, budget thresholds)
  compliance-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procom-compliance-worker
    restart: unless-stopped
    command: php /var/www/html/bin/compliance-worker.php
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      COMPLIANCE_POLL_INTERVAL: "3600"
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - mysql-primary
    networks:
      - backend-net

  # Email Queue Worker (sends queued email notifications)
  email-queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procom-email-queue-worker
    restart: unless-stopped
    command: php /var/www/html/bin/email-queue-worker.php
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: noreply@procom.local
      SMTP_FROM_NAME: proCom System
      EMAIL_QUEUE_POLL_INTERVAL: "30"
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - mysql-primary
      - mailhog
    networks:
      - backend-net

  # SFTP Watcher (monitors directory for CSV imports)
  sftp-watcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procom-sftp-watcher
    restart: unless-stopped
    command: php /var/www/html/bin/sftp-watcher.php
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SFTP_WATCH_DIR: /var/sftp/incoming
      SFTP_PROCESSED_DIR: /var/sftp/processed
      SFTP_POLL_INTERVAL: "60"
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - sftp_incoming:/var/sftp/incoming
      - sftp_processed:/var/sftp/processed
    depends_on:
      - mysql-primary
    networks:
      - backend-net

  # MailHog (development SMTP server with web UI)
  mailhog:
    image: mailhog/mailhog
    container_name: procom-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - backend-net

volumes:
  mysql_primary_data:
  uploads:
  sftp_incoming:
  sftp_processed:

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
