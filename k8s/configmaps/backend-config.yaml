apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: procom
  labels:
    app: procom
    component: backend
data:
  DB_HOST: "mysql-router.procom.svc.cluster.local"
  DB_PORT: "6446"
  DB_PORT_RO: "6447"
  DB_NAME: "procom"
  DB_USER: "procom"
  BACKEND_URL: "http://backend.procom.svc.cluster.local:8080"
  FRONTEND_URL: "http://frontend.procom.svc.cluster.local:9001"
  UPLOAD_DIR: "/var/www/uploads"
  TESSERACT_LANG: "eng"
  PHP_FPM_PM: "dynamic"
  PHP_FPM_MAX_CHILDREN: "50"
  PHP_FPM_START_SERVERS: "5"
  PHP_FPM_MIN_SPARE_SERVERS: "5"
  PHP_FPM_MAX_SPARE_SERVERS: "35"
  nginx.conf: |
    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location ~ /\.ht {
            deny all;
        }
    }
