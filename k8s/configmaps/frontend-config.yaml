apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: readinvoice
  labels:
    app: readinvoice
    component: frontend
data:
  BACKEND_API_URL: "http://backend.readinvoice.svc.cluster.local:8080"
  PHP_FPM_PM: "dynamic"
  PHP_FPM_MAX_CHILDREN: "30"
  PHP_FPM_START_SERVERS: "3"
  PHP_FPM_MIN_SPARE_SERVERS: "3"
  PHP_FPM_MAX_SPARE_SERVERS: "20"
  nginx.conf: |
    server {
        listen 8081;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location ~ /\.ht {
            deny all;
        }
    }
