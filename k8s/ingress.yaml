apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: procom-ingress
  namespace: procom
  labels:
    app: procom
    component: ingress
    version: "1.0.0"
  annotations:
    kubernetes.io/ingress.class: nsx
    ingress.nsx.vmware.com/use-regex: "true"
    ingress.nsx.vmware.com/connection-timeout: "60"
    ingress.nsx.vmware.com/read-timeout: "300"
spec:
  ingressClassName: nsx
  rules:
    - host: procom.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 9001
