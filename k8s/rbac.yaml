apiVersion: v1
kind: ServiceAccount
metadata:
  name: procom-sa
  namespace: procom
  labels:
    app: procom
    component: rbac
    version: "1.0.0"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: procom-role
  namespace: procom
  labels:
    app: procom
    component: rbac
    version: "1.0.0"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: procom-rolebinding
  namespace: procom
  labels:
    app: procom
    component: rbac
    version: "1.0.0"
subjects:
  - kind: ServiceAccount
    name: procom-sa
    namespace: procom
roleRef:
  kind: Role
  name: procom-role
  apiGroup: rbac.authorization.k8s.io
