apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: readinvoice-secrets
  namespace: readinvoice
  labels:
    app: readinvoice
    component: secrets
spec:
  encryptedData:
    MYSQL_ROOT_PASSWORD: AgBY...REPLACE_WITH_SEALED_VALUE...
    MYSQL_PASSWORD: AgBY...REPLACE_WITH_SEALED_VALUE...
    DB_PASS: AgBY...REPLACE_WITH_SEALED_VALUE...
    MYSQL_ROUTER_PASSWORD: AgBY...REPLACE_WITH_SEALED_VALUE...
  template:
    metadata:
      name: readinvoice-secrets
      namespace: readinvoice
      labels:
        app: readinvoice
        component: secrets
    type: Opaque
    data:
      MYSQL_ROOT_PASSWORD: "{{ index . \"MYSQL_ROOT_PASSWORD\" }}"
      MYSQL_DATABASE: "readinvoice"
      MYSQL_USER: "readinvoice"
      MYSQL_PASSWORD: "{{ index . \"MYSQL_PASSWORD\" }}"
      DB_PASS: "{{ index . \"DB_PASS\" }}"
      MYSQL_ROUTER_PASSWORD: "{{ index . \"MYSQL_ROUTER_PASSWORD\" }}"
---
# To generate sealed secrets, use:
# echo -n 'your-secret-value' | kubeseal --controller-name=sealed-secrets \
#   --controller-namespace=kube-system --format yaml \
#   --merge-into k8s/secrets/sealed-secrets.yaml
#
# Required secrets to seal:
#   MYSQL_ROOT_PASSWORD - MySQL root password
#   MYSQL_PASSWORD      - Application MySQL user password
#   DB_PASS             - Backend database password
#   MYSQL_ROUTER_PASSWORD - MySQL Router bootstrap password
