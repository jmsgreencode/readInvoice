apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: procom
  labels:
    app: procom
    component: mysql
    version: "8.4"
spec:
  serviceName: mysql-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: procom
      component: mysql
  template:
    metadata:
      labels:
        app: procom
        component: mysql
        version: "8.4"
    spec:
      serviceAccountName: procom-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: procom
              component: mysql
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: procom
              component: mysql
      containers:
        - name: mysql
          image: mysql/mysql-server:8.4
          ports:
            - containerPort: 3306
              protocol: TCP
              name: mysql
            - containerPort: 33060
              protocol: TCP
              name: mysqlx
            - containerPort: 33061
              protocol: TCP
              name: mysql-gr
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: procom-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: procom-secrets
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: procom-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: procom-secrets
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-tmp
              mountPath: /tmp
      volumes:
        - name: mysql-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
        labels:
          app: procom
          component: mysql
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: vmware-system-csi
        resources:
          requests:
            storage: 20Gi
